name: Build and deploy docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      DOCS_GA_ID: ${{ vars.DOCS_GA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm docs:test

      - name: Build
        run: pnpm docs:build

      - name: Verify generated site
        run: |
          test -s docs/.vuepress/dist/index.html
          test -s docs/.vuepress/dist/zh/index.html

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vuepress/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish via FTP
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        shell: bash
        run: |
          set -euo pipefail
          require_secret() {
            if [[ -z "$2" ]]; then
              echo "::error::Missing required secret: $1"
              exit 1
            fi
          }
          require_secret FTP_SERVER "$FTP_SERVER"
          require_secret FTP_USERNAME "$FTP_USERNAME"
          require_secret FTP_PASSWORD "$FTP_PASSWORD"
          require_secret FTP_SERVER_DIR "$FTP_SERVER_DIR"
          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == *"/"* ]]; then
            echo "::error::FTP_SERVER must be a hostname or IP, not a URL."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must end with a slash."
            exit 1
          fi
          case "$FTP_PROTOCOL" in
            ftp|ftps|ftps-legacy) ;;
            *)
              echo "::error::FTP_PROTOCOL must be ftp, ftps, or ftps-legacy."
              exit 1
              ;;
          esac
          if [[ ! "$FTP_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::FTP_PORT must be a valid port number."
            exit 1
          fi
          if (( 10#$FTP_PORT < 1 || 10#$FTP_PORT > 65535 )); then
            echo "::error::FTP_PORT must be between 1 and 65535."
            exit 1
          fi

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Deploy site
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: site/
          security: strict
          dangerous-clean-slate: false
