name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      DOCS_GA_ID: ${{ vars.DOCS_GA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm docs:test

      - name: Build
        run: pnpm docs:build

      - name: Verify generated site
        run: |
          test -s docs/.vuepress/dist/index.html
          test -s docs/.vuepress/dist/zh/index.html

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vuepress/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to Azure Static Web Apps
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_MUD_0DA5A8610 }}
        run: |
          if [[ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]]; then
            echo "::error::Missing repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_MUD_0DA5A8610"
            exit 1
          fi

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Verify deployment artifact
        run: |
          test -s site/index.html
          test -s site/zh/index.html

      - name: Deploy site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_MUD_0DA5A8610 }}
          action: upload
          app_location: site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
