<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="17" font-weight="bold" fill="#111827">Global NeuCharPivot Floating Invocation Flow</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="200" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="130" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Any Admin Page</text>
  <text x="130" y="116" text-anchor="middle" font-size="12" fill="#374151">floating pivot button (host: ncf-global-function-host)</text>

  <line x1="130" y1="134" x2="130" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <rect x="30" y="172" width="200" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="198" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Frontend Entry</text>
  <text x="130" y="218" text-anchor="middle" font-size="11.5" fill="#374151">window.NeuCharPivotFunction.open({moduleUid, functionKey})</text>

  <line x1="130" y1="236" x2="130" y2="272" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Step 3: server entry -->
  <rect x="30" y="274" width="200" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="130" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Server-side Entry</text>
  <text x="130" y="320" text-anchor="middle" font-size="11.5" fill="#374151">NeuCharPivotGlobalFunctionService.ResolveAsync</text>

  <line x1="130" y1="338" x2="130" y2="374" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Decision 1 -->
  <polygon points="130,376 260,420 130,464 0,420" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="130" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#854d0e">AllowGlobalPivot</text>
  <text x="130" y="432" text-anchor="middle" font-size="12" fill="#854d0e">explicitly declared?</text>

  <!-- deny box -->
  <rect x="300" y="392" width="190" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="395" y="415" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">Rejected</text>
  <text x="395" y="434" text-anchor="middle" font-size="11.5" fill="#7f1d1d">function not allowed globally</text>
  <line x1="260" y1="420" x2="298" y2="420" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="270" y="410" font-size="11" fill="#dc2626">No</text>

  <!-- yes to decision 2 -->
  <line x1="130" y1="464" x2="130" y2="500" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="140" y="486" font-size="11" fill="#059669">Yes</text>

  <rect x="30" y="502" width="200" height="52" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="130" y="524" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3730a3">Access Check</text>
  <text x="130" y="542" text-anchor="middle" font-size="11" fill="#374151">logged-in admin + roles/permissions</text>

  <!-- Right column: execution -->
  <rect x="560" y="70" width="220" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Render Parameter Form</text>
  <text x="670" y="116" text-anchor="middle" font-size="11.5" fill="#374151">dialog from function descriptor</text>

  <line x1="670" y1="134" x2="670" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="560" y="172" width="220" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="198" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Execute Function</text>
  <text x="670" y="218" text-anchor="middle" font-size="11.5" fill="#374151">same execution pipeline as module Function</text>

  <line x1="670" y1="236" x2="670" y2="272" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <rect x="560" y="274" width="220" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="300" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Result View</text>
  <text x="670" y="320" text-anchor="middle" font-size="11.5" fill="#374151">HTML / text result in dialog</text>

  <!-- connect access check to render -->
  <path d="M 230 528 C 420 528, 500 300, 660 134" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
  <text x="430" y="470" font-size="11.5" fill="#059669">granted</text>

  <!-- Role/permission note -->
  <rect x="560" y="380" width="390" height="174" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="576" y="404" font-size="13" font-weight="bold" fill="#374151">Access policies (FunctionRender metadata)</text>
  <g font-size="11.5" fill="#374151">
    <text x="576" y="428">• AllowGlobalPivot defaults to false (opt-in required)</text>
    <text x="576" y="450">• no role/permission configured: any logged-in admin</text>
    <text x="576" y="472">• GlobalPivotRoleCodes / GlobalPivotPermissionCodes</text>
    <text x="590" y="490">comma-separated; role OR permission match grants access</text>
    <text x="576" y="512">• denial is enforced server-side (read + execute)</text>
    <text x="576" y="534">• example: Sandbox Create / Exec / Destroy enabled</text>
  </g>
</svg>
