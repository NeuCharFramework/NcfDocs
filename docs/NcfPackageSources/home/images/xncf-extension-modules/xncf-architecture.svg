<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Host site layer -->
  <rect x="20" y="20" width="820" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="bold" fill="#9a3412">Host Site (Senparc.Web / NcfSimulatedSite)</text>
  <g font-size="13" fill="#1f2937">
    <rect x="40" y="62" width="150" height="34" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="115" y="84" text-anchor="middle">Admin Backoffice</text>
    <rect x="204" y="62" width="170" height="34" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="289" y="84" text-anchor="middle">Menu &amp; Permission</text>
    <rect x="388" y="62" width="190" height="34" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="483" y="84" text-anchor="middle">NeuCharPivot (Global)</text>
    <rect x="592" y="62" width="130" height="34" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="657" y="84" text-anchor="middle">Download Page</text>
    <rect x="736" y="62" width="88" height="34" rx="8" fill="#ffffff" stroke="#ea580c"/>
    <text x="780" y="84" text-anchor="middle">Razor Pages</text>
  </g>

  <!-- XNCF module layer -->
  <rect x="20" y="170" width="820" height="270" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="40" y="198" font-size="16" font-weight="bold" fill="#065f46">XNCF Capability Module Layer (Senparc.Xncf.*)</text>

  <g font-size="12.5" fill="#1f2937">
    <!-- System group -->
    <rect x="40" y="212" width="185" height="120" rx="10" fill="#ffffff" stroke="#059669"/>
    <text x="132" y="234" text-anchor="middle" font-weight="bold" fill="#065f46">System Baseline</text>
    <text x="52" y="256">Menu (5940)</text>
    <text x="52" y="274">XncfModuleManager (5950)</text>
    <text x="52" y="292">AreasBase (5955)</text>
    <text x="52" y="310">SystemPermission (5960)</text>
    <text x="52" y="328">SystemCore / SystemManager / Tenant</text>

    <!-- AI group -->
    <rect x="240" y="212" width="240" height="120" rx="10" fill="#ffffff" stroke="#059669"/>
    <text x="360" y="234" text-anchor="middle" font-weight="bold" fill="#065f46">AI / Agent / Workflow</text>
    <text x="252" y="256">AIKernel 5.0.5</text>
    <text x="252" y="274">PromptRange 0.15.2 (5897)</text>
    <text x="252" y="292">AgentsManager 0.3.22</text>
    <text x="252" y="310">KnowledgeBase 0.1.10</text>
    <text x="252" y="328">NeuCharWorkflow 0.1.0-preview1 (5890)</text>

    <!-- Platform group -->
    <rect x="495" y="212" width="160" height="120" rx="10" fill="#ffffff" stroke="#059669"/>
    <text x="575" y="234" text-anchor="middle" font-weight="bold" fill="#065f46">Platform</text>
    <text x="507" y="256">Sandbox (Docker/Wasm)</text>
    <text x="507" y="274">DesktopBridge</text>
    <text x="507" y="292">Dapr</text>
    <text x="507" y="310">WeixinManager (5880)</text>
    <text x="507" y="328">MCP (EnableMcpServer)</text>

    <!-- Ops group -->
    <rect x="670" y="212" width="155" height="120" rx="10" fill="#ffffff" stroke="#059669"/>
    <text x="747" y="234" text-anchor="middle" font-weight="bold" fill="#065f46">Dev &amp; Ops</text>
    <text x="682" y="256">XncfBuilder 0.10.3 (5896)</text>
    <text x="682" y="274">DatabaseToolkit 0.7.1</text>
    <text x="682" y="292">FileManager 0.6.0</text>
    <text x="682" y="310">FirmwareUpdate</text>
    <text x="682" y="328">Swagger / Terminal / ...</text>

    <!-- Cross-cutting notes -->
    <rect x="40" y="348" width="785" height="70" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-dasharray="5 4"/>
    <text x="52" y="370" font-weight="bold" fill="#065f46">Cross-cutting capabilities (provided by NCF base layer, consumed by every module)</text>
    <text x="52" y="392">[FunctionRender] auto-scan registration (AllowAiInvocation / AllowGlobalPivot / role &amp; permission policies)</text>
    <text x="52" y="410">MCP unified switch EnableMcpServer + route mcp-&lt;module&gt; · module-owned DbContext migrations · NeuBell notification channel</text>
  </g>

  <!-- NCF base layer -->
  <rect x="20" y="470" width="820" height="110" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="40" y="498" font-size="16" font-weight="bold" fill="#3730a3">NCF Foundation Layer (Senparc.Ncf.*)</text>
  <g font-size="13" fill="#1f2937">
    <rect x="40" y="512" width="180" height="34" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="130" y="534" text-anchor="middle">Core (EventBus / Auth)</text>
    <rect x="234" y="512" width="170" height="34" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="319" y="534" text-anchor="middle">XncfBase (Register)</text>
    <rect x="418" y="512" width="170" height="34" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="503" y="534" text-anchor="middle">Repository / Service</text>
    <rect x="602" y="512" width="220" height="34" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="712" y="534" text-anchor="middle">Database* (7 dialects + Plant)</text>
  </g>

  <!-- Arrows between layers -->
  <line x1="430" y1="130" x2="430" y2="168" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="440" x2="430" y2="468" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Lifecycle side box -->
  <rect x="858" y="170" width="104" height="270" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="910" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Lifecycle</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <rect x="870" y="210" width="80" height="30" rx="8" fill="#ffffff" stroke="#9ca3af"/><text x="910" y="230">Install</text>
    <line x1="910" y1="240" x2="910" y2="256" stroke="#6b7280" marker-end="url(#arrow)"/>
    <rect x="870" y="258" width="80" height="30" rx="8" fill="#ffffff" stroke="#9ca3af"/><text x="910" y="278">Open</text>
    <line x1="910" y1="288" x2="910" y2="304" stroke="#6b7280" marker-end="url(#arrow)"/>
    <rect x="870" y="306" width="80" height="30" rx="8" fill="#ffffff" stroke="#9ca3af"/><text x="910" y="326">Run</text>
    <line x1="910" y1="336" x2="910" y2="352" stroke="#6b7280" marker-end="url(#arrow)"/>
    <rect x="870" y="354" width="80" height="30" rx="8" fill="#ffffff" stroke="#9ca3af"/><text x="910" y="374">Update</text>
    <line x1="910" y1="384" x2="910" y2="400" stroke="#6b7280" marker-end="url(#arrow)"/>
    <rect x="870" y="402" width="80" height="30" rx="8" fill="#ffffff" stroke="#9ca3af"/><text x="910" y="422">Disable</text>
  </g>
</svg>
